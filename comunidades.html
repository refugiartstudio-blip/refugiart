
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunidades | RefugiART</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chat-container {
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
    }
    .chat-box {
      height: 380px;
      overflow-y: auto;
      padding: 15px;
      background: #fffdf6;
      border: 1px solid #d8d0bd;
      border-radius: 12px;
      margin: 15px 0;
    }
    .message {
      padding: 10px 12px;
      margin-bottom: 10px;
      background: #f0eadb;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    .message small {
      display: block;
      color: #666;
      margin-bottom: 4px;
    }
    .chat-form {
      display: flex;
      gap: 8px;
    }
    .chat-form input {
      flex: 1;
      min-width: 0;
      padding: 12px;
    }
    .chat-form button, .logout-button {
      padding: 10px 15px;
      cursor: pointer;
    }
    #status {
      color: #555;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="chat-container">
    <h1>Comunidades RefugiART</h1>
    <p>Bem-vindo(a), <strong id="member-name">membro</strong>!</p>
    <button id="logout-button" class="logout-button" type="button">
      Sair da conta
    </button>

    <h2>Chat global</h2>
    <p>Converse com outros membros da comunidade artística.</p>
    <p id="status">Verificando conexão...</p>

    <div id="chat-box" class="chat-box" aria-live="polite"></div>

    <form id="chat-form" class="chat-form">
      <input
        id="message-input"
        type="text"
        maxlength="2000"
        placeholder="Escreva sua mensagem..."
        autocomplete="off"
        required
      >
      <button id="send-button" type="submit">Enviar</button>
    </form>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://nlqalpiksbqflzxzsgoa.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_BpJHFuq0WQaH5hGYOuC20Q_grO6loaP';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const status = document.getElementById('status');
    const chatBox = document.getElementById('chat-box');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const sendButton = document.getElementById('send-button');
    const logoutButton = document.getElementById('logout-button');
    const memberName = document.getElementById('member-name');

    let currentUser = null;
    let channel = null;

    function showStatus(message) {
      status.textContent = message;
    }

    function addMessage(message) {
      const item = document.createElement('div');
      item.className = 'message';

      const author = document.createElement('small');
      author.textContent = 'Membro ' + message.user_id.slice(0, 6);

      const content = document.createElement('div');
      content.textContent = message.content;

      const date = document.createElement('small');
      date.textContent = new Date(message.created_at).toLocaleString('pt-BR');

      item.append(author, content, date);
      chatBox.appendChild(item);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function loadMessages() {
      const { data, error } = await supabase
        .from('chat_messages')
        .select('id, user_id, content, created_at')
        .order('created_at', { ascending: false })
        .limit(50);

      if (error) {
        showStatus('Não foi possível carregar as mensagens: ' + error.message);
        return;
      }

      chatBox.replaceChildren();
      data.reverse().forEach(addMessage);
      showStatus('Chat conectado. Você pode enviar mensagens.');
    }

    async function startChat() {
      const { data, error } = await supabase.auth.getSession();

      if (error || !data.session) {
        window.location.href = 'login.html';
        return;
      }

      currentUser = data.session.user;

      const metadata = currentUser.user_metadata || {};
      memberName.textContent =
        metadata.nome || currentUser.email || 'membro';

      await loadMessages();

      channel = supabase
        .channel('chat-global')
        .on(
          'postgres_changes',
          {
            event: 'INSERT',
            schema: 'public',
            table: 'chat_messages'
          },
          (payload) => {
            if (!document.querySelector(
              '[data-message-id="' + payload.new.id + '"]'
            )) {
              addMessage(payload.new);
            }
          }
        )
        .subscribe((state) => {
          if (state === 'SUBSCRIBED') {
            showStatus('Chat conectado em tempo real.');
          } else if (state === 'CHANNEL_ERROR') {
            showStatus('Erro na conexão em tempo real. Confira o Supabase.');
          }
        });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const content = input.value.trim();
      if (!content || !currentUser) return;

      sendButton.disabled = true;

      const { error } = await supabase
        .from('chat_messages')
        .insert({
          user_id: currentUser.id,
          content
        });

      sendButton.disabled = false;

      if (error) {
        showStatus('Não foi possível enviar: ' + error.message);
        return;
      }

      input.value = '';
      input.focus();
    });

    logoutButton.addEventListener('click', async () => {
      logoutButton.disabled = true;
      const { error } = await supabase.auth.signOut();

      if (error) {
        showStatus('Erro ao sair: ' + error.message);
        logoutButton.disabled = false;
        return;
      }

      window.location.href = 'login.html';
    });

    startChat();
  </script>
</body>
</html>
