
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu perfil | RefugiART</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-container {
      max-width: 650px;
      margin: 30px auto;
      padding: 24px;
      background: #fffdf6;
      border: 1px solid #ded6c5;
      border-radius: 14px;
    }
    .profile-container label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }
    .profile-container input,
    .profile-container textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #c9c1b0;
      border-radius: 8px;
      font: inherit;
    }
    .profile-container textarea {
      min-height: 110px;
      resize: vertical;
    }
    .profile-container button {
      margin-top: 18px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #profile-photo {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      background: #eee7d8;
      display: block;
      margin: 15px auto;
    }
    #status {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="profile-container">
    <a href="comunidades.html">← Voltar às comunidades</a>

    <h1>Meu perfil artístico</h1>
    <p>Apresente seu trabalho à comunidade RefugiART.</p>

    <img id="profile-photo" alt="Foto de perfil"
      src="https://placehold.co/120x120/e8dfca/40543c?text=Arte">

    <form id="profile-form">
      <label for="nome">Nome artístico</label>
      <input id="nome" type="text" maxlength="80"
        placeholder="Como você quer ser conhecido?" required>

      <label for="area">Área de atuação</label>
      <input id="area" type="text" maxlength="120"
        placeholder="Ex.: desenho, pintura, tatuagem">

      <label for="bio">Biografia</label>
      <textarea id="bio" maxlength="1000"
        placeholder="Conte um pouco sobre você e sua arte"></textarea>

      <label for="foto">Endereço da foto (URL)</label>
      <input id="foto" type="url" maxlength="1000"
        placeholder="https://...">

      <button id="save-button" type="submit">Salvar perfil</button>
    </form>

    <p id="status" role="status">Carregando perfil...</p>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://nlqalpiksbqflzxzsgoa.supabase.co',
      'sb_publishable_BpJHFuq0WQaH5hGYOuC20Q_grO6loaP'
    );

    const form = document.getElementById('profile-form');
    const nome = document.getElementById('nome');
    const area = document.getElementById('area');
    const bio = document.getElementById('bio');
    const foto = document.getElementById('foto');
    const photoPreview = document.getElementById('profile-photo');
    const status = document.getElementById('status');
    const saveButton = document.getElementById('save-button');

    let userId = null;

    function updatePhoto() {
      const url = foto.value.trim();
      photoPreview.src = url || 
        'https://placehold.co/120x120/e8dfca/40543c?text=Arte';
    }

    foto.addEventListener('input', updatePhoto);

    photoPreview.addEventListener('error', () => {
      photoPreview.src =
        'https://placehold.co/120x120/e8dfca/40543c?text=Arte';
    });

    async function loadProfile() {
      const { data: sessionData, error: sessionError } =
        await supabase.auth.getSession();

      if (sessionError || !sessionData.session) {
        window.location.href = 'login.html';
        return;
      }

      const user = sessionData.session.user;
      userId = user.id;

      const { data, error } = await supabase
        .from('profiles')
        .select('nome_artistico, biografia, area_atuacao, foto_url')
        .eq('id', userId)
        .maybeSingle();

      if (error) {
        status.textContent = 'Erro ao carregar perfil: ' + error.message;
        return;
      }

      const metadata = user.user_metadata || {};

      nome.value = data?.nome_artistico || metadata.nome || '';
      area.value = data?.area_atuacao || '';
      bio.value = data?.biografia || '';
      foto.value = data?.foto_url || '';

      updatePhoto();
      status.textContent = data
        ? 'Perfil carregado. Você pode editar os campos.'
        : 'Preencha seus dados e salve seu primeiro perfil.';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!userId) return;

      saveButton.disabled = true;
      status.textContent = 'Salvando...';

      const profile = {
        id: userId,
        nome_artistico: nome.value.trim(),
        biografia: bio.value.trim(),
        area_atuacao: area.value.trim(),
        foto_url: foto.value.trim() || null,
        updated_at: new Date().toISOString()
      };

      const { error } = await supabase
        .from('profiles')
        .upsert(profile, { onConflict: 'id' });

      saveButton.disabled = false;

      if (error) {
        status.textContent = 'Erro ao salvar: ' + error.message;
        return;
      }

      status.textContent = 'Perfil salvo com sucesso!';
    });

    loadProfile();
  </script>
</body>
</html>
